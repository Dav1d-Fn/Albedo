[package]
name = "albedo-companion"
version = "0.2.0"
description = "Albedo Companion: runs the companion API for the Deck in the tray and manages it (library, groups, pictures, pairing, Sunshine login)"
authors = ["David F"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "albedo_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
albedo-companion-core = { path = "../../companion" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
