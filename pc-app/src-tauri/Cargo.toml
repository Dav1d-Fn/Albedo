[package]
name = "albedo-pc"
version = "0.1.0"
description = "Albedo PC app: manages the PC companion (library, groups, pictures, pairing, Sunshine login)"
authors = ["David F"]
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "albedo_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
