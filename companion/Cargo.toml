[package]
name = "albedo-companion-core"
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PC companion of Albedo: lists installed games and adds them to Sunshine"

[dependencies]
libc = "0.2"
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }

[profile.release]
strip = true
