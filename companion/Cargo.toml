[package]
name = "streaming-launcher-companion"
version = "0.1.0"
edition = "2021"
description = "PC companion of the streaming launcher: lists installed games and adds them to Sunshine"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }

[profile.release]
strip = true
