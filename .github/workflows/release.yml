# Builds the signed AppImage and publishes it as a GitHub release, together with the latest.json
# the in-app updater reads. Start it by pushing a tag: git tag v0.2.0 && git push origin v0.2.0
# (the version in src-tauri/tauri.conf.json must match the tag).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # Ubuntu 22.04 has an older glibc than SteamOS, so the AppImage runs on the Deck.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseDraft: false
          # Updater artifacts (.sig + latest.json) only here, so local builds need no signing key.
          args: --bundles appimage --config {"bundle":{"createUpdaterArtifacts":true}}

  # PC side (Albedo Companion: companion API + tray app in one AppImage), so nobody needs Rust or Node
  # on the gaming PC. pc-setup/install.sh downloads it under a fixed name from
  # releases/latest/download/, so the name must not carry the version.
  pc-app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc-app/src-tauri

      # The PC app uses the npm packages of the repository root.
      - run: npm ci

      - name: Build AppImage
        working-directory: pc-app
        env:
          # Same key as the Deck app; createUpdaterArtifacts writes the .sig next to the AppImage.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # PATH also for tsc and vite in the beforeBuildCommand
        run: |
          PATH="$PWD/../node_modules/.bin:$PATH" tauri build --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":true}}'
          cp src-tauri/target/release/bundle/appimage/*.AppImage ../Albedo-Companion-x86_64.AppImage
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig ../Albedo-Companion-x86_64.AppImage.sig

      # The companion's own updater file (pc-app/src-tauri/tauri.conf.json "updater" endpoint), apart
      # from the Deck's latest.json. Its version is the companion's, so a release that leaves the
      # companion's version as it was offers it no update.
      - name: latest-companion.json
        run: |
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          url="https://github.com/${{ github.repository }}/releases/download/$tag/Albedo-Companion-x86_64.AppImage"
          jq -n \
            --arg version "$(jq -r .version pc-app/src-tauri/tauri.conf.json)" \
            --arg notes "Albedo $tag" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat Albedo-Companion-x86_64.AppImage.sig)" \
            --arg url "$url" \
            '{version: $version, notes: $notes, pub_date: $date, platforms: {
               "linux-x86_64": {signature: $signature, url: $url},
               "linux-x86_64-appimage": {signature: $signature, url: $url}}}' \
            > latest-companion.json
          cat latest-companion.json

      - uses: actions/upload-artifact@v4
        with:
          name: pc-app
          path: |
            Albedo-Companion-x86_64.AppImage
            Albedo-Companion-x86_64.AppImage.sig
            latest-companion.json

  # Adds the PC AppImage (+ .sig and latest-companion.json for its updater) and SHA256SUMS to the release the appimage job created. Runs after it,
  # so the Deck AppImage and latest.json stay exactly as tauri-action made them.
  pc-assets:
    needs: [appimage, pc-app]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Upload with checksums
        run: |
          # Same tag name tauri-action used (v__VERSION__), also for a manual run.
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          gh release download "$tag" --pattern "*.AppImage" --dir assets --skip-existing
          cd assets
          sha256sum -- *.AppImage > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$tag" --clobber Albedo-Companion-x86_64.AppImage Albedo-Companion-x86_64.AppImage.sig latest-companion.json SHA256SUMS
