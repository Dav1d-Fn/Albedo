# Builds the signed AppImage and publishes it as a GitHub release, together with the latest.json
# the in-app updater reads. Start it by pushing a tag: git tag v0.2.0 && git push origin v0.2.0
# (the version in src-tauri/tauri.conf.json must match the tag).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # Ubuntu 22.04 has an older glibc than SteamOS, so the AppImage runs on the Deck.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: v__VERSION__
          releaseDraft: false
          # Updater artifacts (.sig + latest.json) only here, so local builds need no signing key.
          args: --bundles appimage --config {"bundle":{"createUpdaterArtifacts":true}}

  # PC side, so nobody needs Rust or Node on the gaming PC. pc-setup/install.sh downloads these
  # under fixed names from releases/latest/download/, so the names must not carry the version.
  companion:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # musl: a fully static binary that runs on any x86_64 distribution, whatever its glibc.
      # The companion is pure Rust (it calls curl as a program), so no musl C toolchain is needed.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: companion

      - name: Build
        working-directory: companion
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Pack binary and service file
        run: |
          mkdir -p out/albedo-companion
          cp companion/target/x86_64-unknown-linux-musl/release/albedo-companion out/albedo-companion/
          cp companion/albedo-companion.service out/albedo-companion/
          tar -C out -czf albedo-companion-x86_64-linux.tar.gz albedo-companion

      - uses: actions/upload-artifact@v4
        with:
          name: companion
          path: albedo-companion-x86_64-linux.tar.gz

  pc-app:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc-app/src-tauri

      # The PC app uses the npm packages of the repository root.
      - run: npm ci

      - name: Build AppImage
        working-directory: pc-app
        # PATH also for tsc and vite in the beforeBuildCommand
        run: |
          PATH="$PWD/../node_modules/.bin:$PATH" tauri build --bundles appimage
          cp src-tauri/target/release/bundle/appimage/*.AppImage ../Albedo-PC-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: pc-app
          path: Albedo-PC-x86_64.AppImage

  # Adds the PC files and SHA256SUMS to the release the appimage job created. Runs after it,
  # so the Deck AppImage and latest.json stay exactly as tauri-action made them.
  pc-assets:
    needs: [appimage, companion, pc-app]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Upload with checksums
        run: |
          # Same tag name tauri-action used (v__VERSION__), also for a manual run.
          tag="v$(jq -r .version src-tauri/tauri.conf.json)"
          gh release download "$tag" --pattern "*.AppImage" --dir assets --skip-existing
          cd assets
          sha256sum -- *.AppImage *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$tag" --clobber albedo-companion-x86_64-linux.tar.gz Albedo-PC-x86_64.AppImage SHA256SUMS
